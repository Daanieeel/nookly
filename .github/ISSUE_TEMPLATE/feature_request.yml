name: Feature request
description: Suggest an idea or improvement for Nookly
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: module
    attributes:
      label: Area
      multiple: true
      options:
        - Bookmarks
        - Calendar
        - CLI
        - Exams and decks
        - Files
        - Jots
        - Markdown editor
        - Navigation and UI
        - Notes
        - Settings
        - Tasks
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links or anything else that helps.
