# Keeps a warm Rust build cache for releases.
#
# GitHub only lets a tag run read caches saved on main, never ones saved by
# another tag. So this builds the release profile on main and saves it, under
# the same key the release workflow restores. It runs when dependencies change
# and twice a week, because GitHub drops caches that go unused for 7 days.
name: Release cache

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: Warm (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: xcode-27
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: xcode-27
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Same build as a release, minus bundling, signing and uploading.
      - run: bun run tauri build --no-bundle --target ${{ matrix.target }}
        working-directory: apps/desktop
