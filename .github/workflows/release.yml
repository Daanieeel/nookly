name: Release

# Push a tag like `v0.2.0` to build installers for every platform and attach
# them to a GitHub release. Once every build succeeds, SHA256SUMS is
# uploaded, the notes are rewritten (GitHub's generated "What's Changed" plus
# download links), and CHANGELOG.md on `main` is regenerated and committed.
# Pushing the tag is the publish step; the release goes live as soon as the
# builds finish. GitHub draft releases get a temporary `untagged-<hash>`
# asset path that's reassigned on every edit, so any link written into a
# draft's notes is dead by the time the edit that added it returns. Only a
# published release has the permanent `download/$TAG/<file>` path this
# workflow's notes rely on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Compare tag with package.json, Cargo.toml and tauri.conf.json
        working-directory: apps/desktop
        run: |
          expected="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tag=$expected package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if [ "$pkg" != "$expected" ] || [ "$tauri" != "$expected" ] || [ "$cargo" != "$expected" ]; then
            echo "::error::Version mismatch. Bump all three files to $expected before tagging."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          # Oldest supported Ubuntu, so the AppImage and .deb run on older glibc too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Builds are unsigned until signing secrets are configured. When they are,
      # tauri-action picks up APPLE_CERTIFICATE / APPLE_ID / etc. from env.
      # The updater key signs the update bundles; tauri-action then uploads
      # latest.json, which the in-app updater reads from the latest release.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: Nookly ${{ env.TAG }}
          releaseBody: "See the assets below to download and install for your platform."
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --target ${{ matrix.target }}

      # v0.1.2 shipped a crash that only happened on the *second* launch of the
      # packaged .app (macOS aborts in AppKit's window-state restore without
      # NSApplicationSupportsSecureRestorableState in Info.plist) — invisible in
      # `bun run dev` and on a first launch, only caught by relaunching the real
      # bundle. This launches it twice and fails the job if it dies or writes
      # crash.log. Runs after tauri-action has already uploaded the asset, so a
      # failure here doesn't stop the bad build going up — it flags this job red
      # so it gets caught before anyone points users at the release.
      - name: Smoke test (macOS relaunch crash check)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Nookly.app"
          bin="$app/Contents/MacOS/Nookly"
          [ -x "$bin" ] || { echo "::error::built app not found at $bin"; exit 1; }
          xattr -cr "$app"

          crash_log="$HOME/Library/Application Support/com.nookly.app/crash.log"
          rm -f "$crash_log"

          for i in 1 2; do
            echo "Launch $i"
            "$bin" &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::app exited on launch $i"
              [ -f "$crash_log" ] && cat "$crash_log"
              exit 1
            fi
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          done

          if [ -f "$crash_log" ]; then
            echo "::error::crash.log written during smoke test"
            cat "$crash_log"
            exit 1
          fi
          echo "Smoke test passed: two launches, no crash."

  notes:
    name: Checksums and release notes
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Generate and upload SHA256SUMS
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$REPO" --dir release-assets
          cd release-assets
          find . -maxdepth 1 -type f ! -name "SHA256SUMS*" ! -name "latest.json" ! -name "*.sig" -exec sha256sum {} + \
            | sed 's| \./|  |' | sort -k 2 > ../SHA256SUMS
          cd ..
          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber

      - name: Build release notes (changelog + download links)
        run: |
          set -euo pipefail

          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > changelog.md

          # A draft release's assets live under a temporary `untagged-<id>` download
          # path that gets reassigned on every edit to the release (including the
          # `gh release edit` below), so any link built from it is dead by the time
          # this job returns. `download/$TAG/<name>` is the permanent path, but it
          # only resolves once the release is published — the release is created
          # non-draft above, so it's live already and this path is stable.
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets')
          base="https://github.com/$REPO/releases/download/$TAG"

          find_url() {
            local name
            name=$(echo "$assets" | jq -r --arg pat "$1" '[.[] | select(.name | test($pat; "i"))][0].name // empty')
            [ -n "$name" ] && echo "$base/$name"
          }

          mac_arm=$(find_url '_aarch64\.dmg$')
          mac_intel=$(find_url '_x(64|86_64)\.dmg$')
          win_msi=$(find_url '\.msi$')
          win_exe=$(find_url '-setup\.exe$')
          deb=$(find_url '\.deb$')
          rpm=$(find_url '\.rpm$')
          appimage=$(find_url '\.AppImage$')
          sha256sums=$(find_url '^SHA256SUMS$')

          {
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo "See the assets below to download and install for your platform."
            echo ""
            echo "**macOS:**"
            [ -n "$mac_arm" ] && echo "- [Apple Silicon]($mac_arm)"
            [ -n "$mac_intel" ] && echo "- [Intel]($mac_intel)"
            echo ""
            echo "> Not code signed yet: macOS will say \`\"Nookly.app\" is damaged and can't be opened\`. Fix: \`xattr -cr /Applications/Nookly.app\`"
            echo ""
            echo "**Windows:**"
            [ -n "$win_msi" ] && echo "- [Installer (.msi)]($win_msi)"
            [ -n "$win_exe" ] && echo "- [Installer (.exe)]($win_exe)"
            echo ""
            echo "**Linux:**"
            [ -n "$deb" ] && echo "- [.deb (Debian/Ubuntu)]($deb)"
            [ -n "$rpm" ] && echo "- [.rpm (Fedora/RHEL)]($rpm)"
            [ -n "$appimage" ] && echo "- [AppImage]($appimage)"
            if [ -n "$sha256sums" ]; then
              echo ""
              echo "**Verification:**"
              echo "- [SHA256SUMS]($sha256sums)"
            fi
          } > notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md

  update-changelog:
    name: Update CHANGELOG.md
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      # The git-cliff action runs in a container, so the file may be root owned.
      - name: Commit and push
        run: |
          sudo chown "$(id -u):$(id -g)" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG [skip ci]"
          git push origin main
