name: Release

# Push a tag like `v0.2.0` to build installers for every platform and attach
# them to a draft GitHub release, with notes generated from the commits since
# the previous tag. Once every build succeeds, CHANGELOG.md on `main` is
# regenerated and committed. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Compare tag with package.json, Cargo.toml and tauri.conf.json
        run: |
          expected="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tag=$expected package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if [ "$pkg" != "$expected" ] || [ "$tauri" != "$expected" ] || [ "$cargo" != "$expected" ]; then
            echo "::error::Version mismatch. Bump all three files to $expected before tagging."
            exit 1
          fi

  changelog:
    name: Generate release notes
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      # Commits since the previous tag, grouped per `cliff.toml`.
      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all

  build:
    name: Build (${{ matrix.name }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          # Oldest supported Ubuntu, so the AppImage and .deb run on older glibc too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Builds are unsigned until signing secrets are configured. When they are,
      # tauri-action picks up APPLE_CERTIFICATE / APPLE_ID / etc. from env.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Nookly ${{ env.TAG }}
          releaseBody: ${{ needs.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --target ${{ matrix.target }}

  update-changelog:
    name: Update CHANGELOG.md
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      # The git-cliff action runs in a container, so the file may be root owned.
      - name: Commit and push
        run: |
          sudo chown "$(id -u):$(id -g)" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for $TAG [skip ci]"
          git push origin main
