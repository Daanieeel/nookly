name: Status

# Checks Nookly's services every five minutes and keeps 90 days of answers in
# status.json on the `status-data` branch, which nookly.work/status reads. The branch
# only ever gets new commits on top; nothing is rewritten.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    name: Check services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --filter @nookly/web

      - name: Check out the history
        run: |
          if git ls-remote --exit-code --heads origin status-data >/dev/null; then
            git fetch --depth 1 origin status-data
            git worktree add status-data FETCH_HEAD
            git -C status-data switch -c status-data
          else
            git worktree add --orphan -b status-data status-data
          fi

      - run: bun apps/web/scripts/status-check.ts status-data/status.json

      - name: Save the history
        working-directory: status-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          # A run that lost a race with another one retries on top of it.
          for attempt in 1 2 3; do
            git push origin HEAD:status-data && exit 0
            git fetch --depth 1 origin status-data
            git reset -q --hard FETCH_HEAD
            bun ../apps/web/scripts/status-check.ts status.json
            git add status.json
            git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          exit 1
