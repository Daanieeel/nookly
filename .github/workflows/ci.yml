name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version is not behind latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun run version:check

  whats-new:
    name: Validate whats-new.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run whats-new:check

  frontend:
    name: Typecheck + lint + test + build (frontend, shared, server)
    runs-on: ubuntu-latest
    # The server's integration tests run against a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nookly
          POSTGRES_PASSWORD: nookly
          POSTGRES_DB: nookly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nookly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nookly:nookly@localhost:5432/nookly_test
      TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      # File storage for the server's tests: MinIO, as in docker-compose.yml. A step,
      # not a service, since it needs a command.
      - name: Start MinIO
        run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=nookly -e MINIO_ROOT_PASSWORD=nookly-dev-secret \
            cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run format:check:js
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  rust:
    name: cargo check + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint:rust

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check:rust

  # Report only: the findings are read, not enforced, so a new advisory in a
  # dependency can't block an unrelated change.
  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: bun install --frozen-lockfile
      - run: bun run deny:rust
        continue-on-error: true
      - run: bun run audit:rust
        continue-on-error: true
      - run: bun run audit:js
        continue-on-error: true

  # Report only, like the audit above: findings are read and fixed on purpose,
  # they never block an unrelated change.
  code-health:
    name: Code health (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: bun install --frozen-lockfile
      - name: Unused dependencies, exports and files (JS)
        run: bun run unused:js
        continue-on-error: true
      - name: Unused dependencies (Rust)
        run: bun run unused:rust
        continue-on-error: true
      - name: Panic budget and long functions (Rust, non-test code)
        run: bun run lint:rust:strict
        continue-on-error: true

  # Enforced: duplication is 0.11% today, and the check fails above 1%, so the
  # cleanup that removed duplicate code does not quietly come undone.
  duplication:
    name: Duplicate code (under 1%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run duplication
