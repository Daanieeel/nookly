name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version is not behind latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun run version:check

  frontend:
    name: Typecheck + lint + test + build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:js
      - run: bun run format:check:js
      - run: bun run test
      - run: bun run build

  rust:
    name: cargo check + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint:rust

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check:rust

  # Report only: the findings are read, not enforced, so a new advisory in a
  # dependency can't block an unrelated change.
  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: bun install --frozen-lockfile
      - run: bun run deny:rust
        continue-on-error: true
      - run: bun run audit:rust
        continue-on-error: true
      - run: bun run audit:js
        continue-on-error: true
