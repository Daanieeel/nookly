name: CI

# Which jobs run depends on what changed (tools/ci-changes.ts), so a documentation fix or a
# server-only change does not run the desktop's whole test suite. A weekly run, and a run by
# hand, check everything, which also catches new dependency advisories.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      js: ${{ steps.plan.outputs.js }}
      filter: ${{ steps.plan.outputs.filter }}
      lint: ${{ steps.plan.outputs.lint }}
      format: ${{ steps.plan.outputs.format }}
      duplication: ${{ steps.plan.outputs.duplication }}
      audit: ${{ steps.plan.outputs.audit }}
      whatsNew: ${{ steps.plan.outputs.whatsNew }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun test tools/ci-changes.test.ts
      - id: plan
        env:
          # Empty on a scheduled or manual run, which then checks everything.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun tools/ci-changes.ts

  version:
    name: Version is not behind latest release
    needs: changes
    if: needs.changes.outputs.version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun run version:check

  whats-new:
    name: Validate whats-new.json
    needs: changes
    if: needs.changes.outputs.whatsNew == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run whats-new:check

  lint:
    name: Lint and format (JS)
    needs: changes
    if: needs.changes.outputs.lint == 'true' || needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - if: needs.changes.outputs.lint == 'true'
        run: bun run lint:js
      - if: needs.changes.outputs.lint == 'true'
        run: bun run lint:keys
      - if: needs.changes.outputs.format == 'true'
        run: bun run format:check:js

  js:
    name: Typecheck, test and build (web, mobile, server, frontend, shared)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    # The server's integration tests run against a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nookly
          POSTGRES_PASSWORD: nookly
          POSTGRES_DB: nookly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nookly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nookly:nookly@localhost:5432/nookly_test
      TEST_S3_ENDPOINT: http://localhost:9000
      FILTER: ${{ needs.changes.outputs.filter }}
    steps:
      # The whole history: turbo compares against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # File storage for the server's tests: MinIO, as in docker-compose.yml. A step,
      # not a service, since it needs a command.
      - name: Start MinIO
        run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=nookly -e MINIO_ROOT_PASSWORD=nookly-dev-secret \
            cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8 server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Only the workspaces that changed and the ones that depend on them, unless the filter is
      # empty (a scheduled run, or a file every workspace reads).
      - run: bunx turbo run typecheck test build ${FILTER:+--filter="$FILTER"}

  rust:
    name: cargo check + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint:rust

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check:rust

  # Report only: the findings are read, not enforced, so a new advisory in a
  # dependency can't block an unrelated change.
  audit:
    name: Dependency audit (report only)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: bun install --frozen-lockfile
      - run: bun run deny:rust
        continue-on-error: true
      - run: bun run audit:rust
        continue-on-error: true
      - run: bun run audit:js
        continue-on-error: true

  # Report only, like the audit above: findings are read and fixed on purpose,
  # they never block an unrelated change.
  code-health:
    name: Code health (report only)
    needs: changes
    if: needs.changes.outputs.duplication == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: bun install --frozen-lockfile
      - name: Unused dependencies, exports and files (JS)
        run: bun run unused:js
        continue-on-error: true
      - name: Unused dependencies (Rust)
        run: bun run unused:rust
        continue-on-error: true
      - name: Panic budget and long functions (Rust, non-test code)
        run: bun run lint:rust:strict
        continue-on-error: true

  # Enforced: duplication is 0.11% today, and the check fails above 1%, so the
  # cleanup that removed duplicate code does not quietly come undone.
  duplication:
    name: Duplicate code (under 1%)
    needs: changes
    if: needs.changes.outputs.duplication == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run duplication
