name: Infrastructure

# Terraform in infrastructure/: checked on every pull request that touches it, planned with
# the production state once deploys are on, and applied on a merge to main. Nothing reaches
# Heroku, Cloudflare or Scaleway until the repository variable DEPLOY_ENABLED is "true".

on:
  pull_request:
    paths: ["infrastructure/**", ".github/workflows/infrastructure.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/**", ".github/workflows/infrastructure.yml"]
  workflow_dispatch:

# One run at a time against the state, and never cancelled halfway through an apply.
concurrency:
  group: infrastructure
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: infrastructure

jobs:
  check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    name: Terraform plan and apply
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # The same Scaleway key reads and writes the state bucket.
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCALEWAY_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCALEWAY_PROJECT_ID }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_beta_key: ${{ secrets.BETA_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      # Only providers with both an id and a secret reach the server; the rest stay off.
      - name: Collect the OAuth provider settings
        env:
          GOOGLE_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          GITHUB_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          NOTION_ID: ${{ secrets.OAUTH_NOTION_CLIENT_ID }}
          NOTION_SECRET: ${{ secrets.OAUTH_NOTION_CLIENT_SECRET }}
          APPLE_ID: ${{ secrets.OAUTH_APPLE_CLIENT_ID }}
          APPLE_SECRET: ${{ secrets.OAUTH_APPLE_CLIENT_SECRET }}
        run: |
          vars=$(jq -nc '
            [ ["GOOGLE", $ENV.GOOGLE_ID, $ENV.GOOGLE_SECRET],
              ["GITHUB", $ENV.GITHUB_ID, $ENV.GITHUB_SECRET],
              ["NOTION", $ENV.NOTION_ID, $ENV.NOTION_SECRET],
              ["APPLE", $ENV.APPLE_ID, $ENV.APPLE_SECRET] ]
            | map(select((.[1] // "") != "" and (.[2] // "") != ""))
            | map({("\(.[0])_CLIENT_ID"): .[1], ("\(.[0])_CLIENT_SECRET"): .[2]})
            | add // {}')
          echo "TF_VAR_extra_sensitive_config_vars=$vars" >> "$GITHUB_ENV"
      - name: Init with the production state
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -var-file=production.tfvars -out=production.plan
      - name: Apply (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false production.plan
