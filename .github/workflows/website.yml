name: Website

# nookly.work, the static site in apps/web. Built on every pull request that touches it;
# built and uploaded to Cloudflare Pages on a merge to main and once a day (fresh star
# count). The download version and links are never built in: the browser reads the latest
# release from GitHub, so a new desktop release shows with no rebuild. The Pages
# project and its domains are Terraform's (infrastructure/). Nothing is uploaded until
# the repository variable DEPLOY_ENABLED is "true".

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/frontend/src/classes.ts"
      - "bun.lock"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/frontend/src/classes.ts"
      - "bun.lock"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read only, for the star count without the anonymous limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web

      - name: Upload to Cloudflare Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy out --project-name nookly-website --branch main --commit-dirty=true
