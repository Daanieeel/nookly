# cargo-deny: `bun run deny:rust`. Checks the dependency tree for known
# vulnerabilities and unmaintained crates, licenses we cannot ship, duplicate
# versions and crates from outside crates.io.
#
# Nothing is silenced here. An advisory that shows up is a finding to read, so
# there is no `ignore` list.

[advisories]
yanked = "warn"

[licenses]
# Permissive licenses, plus MPL-2.0 (file level copyleft, used unmodified) and the
# LGPL-2.1-or-later that r-efi offers alongside MIT and Apache-2.0.
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]

[bans]
# Two versions of one crate bloat the app. Reported, not blocking: most come from
# Tauri's own tree.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
