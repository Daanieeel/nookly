# cargo-mutants: `bun run mutants:rust` (see the root package.json).
#
# It changes the code one small way at a time and reruns the tests. A change
# that no test notices is a gap in the tests. A full run takes hours, so the
# script takes a file or a function filter, e.g.
#   bun run mutants:rust -- --file src/db/series.rs
#   bun run mutants:rust -- --re 'require_one_of'

# The data layer is where a silent wrong answer costs a user their data.
examine_globs = ["src/db/**/*.rs"]

# Tests are not mutated, and neither are the scenario fixtures.
exclude_globs = [
  "src/**/*_tests.rs",
  "src/db/series_scenarios.rs",
  "src/db/migrations.rs",
]

# Library tests only: the process tests start the real binary.
#
# cargo-mutants needs a green baseline. These three tests are red on purpose, they
# pin bugs still open (see POSSIBLE_BUG_LIST.md and the review notes), so they are
# skipped here. Remove each skip once its bug is fixed.
additional_cargo_test_args = [
  "--lib",
  "--",
  "--skip", "fsrs_migration_preserves_leitner_progress",
  "--skip", "move_onto_a_future_slot_generate_then_move_back_leaves_a_hole",
]

# A mutant that makes a loop run forever counts as caught.
timeout_multiplier = 3.0
minimum_test_timeout = 60
