[package]
name = "nookly-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nookly = { path = ".." }

# Not part of the app's workspace or its lockfile.
[workspace]

[[bin]]
name = "cli_arguments"
path = "fuzz_targets/cli_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_archive"
path = "fuzz_targets/backup_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "office_document"
path = "fuzz_targets/office_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calendar_feed"
path = "fuzz_targets/calendar_feed.rs"
test = false
doc = false
bench = false
