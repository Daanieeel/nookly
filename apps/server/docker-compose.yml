# Local development: Postgres and the server, emails printed to the log.
#   docker compose -f apps/server/docker-compose.yml up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nookly
      POSTGRES_PASSWORD: nookly
      POSTGRES_DB: nookly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nookly"]
      interval: 5s
  server:
    build: { context: ../.., dockerfile: apps/server/Dockerfile }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nookly:nookly@postgres:5432/nookly
      JWT_SECRET: development-only-secret-change-me-in-production-please
      PUBLIC_URL: http://localhost:3000
      MAILER: console
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
