# One public VPS: Caddy in front (automatic HTTPS), the server, Postgres. Configure
# with a `.env` next to this file (see `.env.example`), then:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server]
  server:
    build: { context: ../.., dockerfile: apps/server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nookly:${POSTGRES_PASSWORD}@postgres:5432/nookly
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "true"
    expose: ["3000"]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nookly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nookly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nookly"]
      interval: 5s
volumes:
  pgdata:
  caddy_data:
  caddy_config:
