<text x="19" y="180" text-anchor="start" class="small">One of each: Nookly, Google,</text>
<text x="19" y="197" text-anchor="start" class="small">GitHub, Notion. At least one.</text>
<text x="19" y="214" text-anchor="start" class="small">Primary gets the notices and</text>
<text x="19" y="231" text-anchor="start" class="small">can't be disconnected.</text>
<path d="M465 160H678L690 172V242H465Z M678 160V172H690" class="note"/>
<text x="474" y="180" text-anchor="start" class="small">pending: browser step of a</text>
<text x="474" y="197" text-anchor="start" class="small">provider sign in on an account</text>
<text x="474" y="214" text-anchor="start" class="small">with a second step.</text>
<text x="474" y="231" text-anchor="start" class="small">It opens nothing.</text>
