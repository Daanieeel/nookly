<text x="275" y="88" text-anchor="start" class="">username</text>
<text x="275" y="106" text-anchor="start" class="">primaryProvider</text>
<rect x="10" y="40" width="180" height="94" rx="0" class="box"/>
<text x="100.0" y="59" text-anchor="middle" class="bold">SignInMethod</text>
