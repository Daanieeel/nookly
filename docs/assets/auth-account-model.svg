<text x="20" y="88" text-anchor="start" class="">provider</text>
<text x="20" y="106" text-anchor="start" class="">email</text>
<text x="20" y="124" text-anchor="start" class="">emailVerified</text>
<rect x="510" y="40" width="180" height="94" rx="0" class="box"/>
<text x="600.0" y="59" text-anchor="middle" class="bold">Session</text>
<path d="M510 68H690" class="line"/>
<text x="520" y="88" text-anchor="start" class="">provider</text>
<text x="520" y="106" text-anchor="start" class="">pending</text>
<text x="520" y="124" text-anchor="start" class="">reauthedAt</text>
<rect x="265" y="185" width="170" height="106" rx="0" class="box"/>
<text x="350.0" y="201" text-anchor="middle" class="small">«enumeration»</text>
<text x="350.0" y="217" text-anchor="middle" class="bold">SecondStep</text>
<path d="M265 225H435" class="line"/>
<text x="275" y="245" text-anchor="start" class="">authenticator app</text>
<text x="275" y="263" text-anchor="start" class="">emailed code</text>
<text x="275" y="281" text-anchor="start" class="">recovery codes</text>
<path d="M265 80L255 75L245 80L255 85Z" class="solid"/>
<path d="M245 80H190" class="line"/>
