<svg xmlns="http://www.w3.org/2000/svg" width="700" height="274" viewBox="0 28 700 274" role="img" aria-label="Account model: an account has sign in methods, sessions and second steps">
<style>
  svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --fg: #1f2328; --bg: #ffffff; --note: #f6f8fa; --edge: #d1d9e0; }
  @media (prefers-color-scheme: dark) { svg { --fg: #f0f6fc; --bg: #0d1117; --note: #161b22; --edge: #3d444d; } }
  text { fill: var(--fg); font-size: 13px; }
  .small { font-size: 12px; }
  .bold { font-weight: 600; }
  .bg { fill: var(--bg); }
  .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.2; }
  .note { fill: var(--note); stroke: var(--edge); stroke-width: 1.2; }
  .line { fill: none; stroke: var(--fg); stroke-width: 1.2; }
  .head { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .dash { fill: none; stroke: var(--fg); stroke-width: 1; stroke-dasharray: 4 3; }
  .solid { fill: var(--fg); stroke: var(--fg); }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" class="head"/></marker></defs>
<rect x="0" y="28" width="700" height="274" class="bg"/>
<rect x="265" y="40" width="170" height="76" rx="0" class="box"/>
<text x="350.0" y="59" text-anchor="middle" class="bold">Account</text>
