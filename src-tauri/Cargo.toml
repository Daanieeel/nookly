[package]
name = "nookly"
version = "0.0.0"
license = "AGPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nookly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
inventory = "0.3"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
regex = "1"
url = "2"
dirs = "7"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["sync", "time"] }
base64 = "0.22"
sha2 = "0.10"
# FSRS spaced repetition scheduler for index cards (`db/decks.rs`), the one Anki uses.
rs-fsrs = "1.2.1"

# Native page snapshots for bookmark previews (`commands/bookmark_screenshot.rs`) and the
# "Open in" app list (`commands/files.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue", "NSString", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSWorkspace", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
