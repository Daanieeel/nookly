name: nookly
# The whole Nookly backend on localhost: Postgres, MinIO (S3 for files) and the server.
#
#   cp .env.example .env        # once; the defaults work for local development
#   docker compose up -d        # Postgres and MinIO
#   bun run stack               # the same, then migrations and the server with watch mode
#   docker compose --profile server up -d --build   # the server in Docker too
#
# Ports come from .env so they can dodge whatever already runs on this machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nookly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nookly}
      POSTGRES_DB: ${POSTGRES_DB:-nookly}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-nookly}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # MinIO's own images are no longer published; Chainguard builds it from source.
  # The server makes the bucket (with versioning) on start, through the S3 API.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-nookly}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-nookly-dev-secret}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    profiles: [server]
    build: { context: ., dockerfile: apps/server/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nookly}:${POSTGRES_PASSWORD:-nookly}@postgres:5432/${POSTGRES_DB:-nookly}
      S3_ENDPOINT: http://minio:9000
    ports: ["${PORT:-3000}:3000"]

volumes:
  pgdata:
  miniodata:
